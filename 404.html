<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена | hr-video.ru</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#02030A">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#02030A;--fg:#F2F4FA;--muted:#9299B0;--accent:#1F5BFF;--display:"Dela Gothic One","Golos Text",Impact,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:radial-gradient(50% 45% at 30% 25%,#0B1A4F,transparent),var(--bg);color:var(--fg);font:17px/1.55 "Golos Text",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px}
main{max-width:560px;text-align:center;display:grid;gap:18px;justify-items:center}
.code{font-family:var(--display);font-size:clamp(72px,22vw,140px);line-height:1;color:var(--accent)}
h1{font-family:var(--display);font-weight:400;font-size:clamp(24px,6vw,34px);line-height:1.15;margin:0}
p{color:var(--muted);margin:0}
a.btn{margin-top:8px;display:inline-block;padding:14px 22px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600;text-decoration:none}
a.btn:hover{opacity:.88}
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <h1>Такой страницы нет</h1>
  <p>Возможно, ссылка устарела или в адресе опечатка. Все примеры роликов и цены на главной.</p>
  <a class="btn" href="/">На главную</a>
</main>
</body>
</html>
